<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 273 35" role="img" aria-label="TMDB">
  <!--
    APPROXIMATION of The Movie Database (TMDB) primary logo, provided so the
    required attribution can render a mark in development. It is NOT the official
    brand asset. Before any production launch, replace this file with the
    approved TMDB logo downloaded from https://www.themoviedb.org/about/logos.
  -->
  <defs>
    <linearGradient id="tmdb-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#90cea1" />
      <stop offset="56%" stop-color="#3cbec9" />
      <stop offset="100%" stop-color="#01b4e4" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="273" height="35" rx="8" fill="url(#tmdb-gradient)" />
  <text x="136.5" y="24.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#ffffff">TMDB</text>
</svg>
